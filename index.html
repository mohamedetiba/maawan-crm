const timeAgo = ts => {
  if (!ts) return "";
  const d = new Date(ts); if (isNaN(d)) return "";
  const mins = Math.floor((Date.now()-d)/60000);
  if (mins<1) return "الآن";
  if (mins<60) return mins+" د";
  if (mins<1440) return Math.floor(mins/60)+" س";
  return d.toLocaleDateString("ar-EG",{day:"numeric",month:"short"});
};
const daysUntil = (dateStr) => {
  if (!dateStr) return null;
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  const n = new Date(); n.setHours(0,0,0,0);
  return Math.round((d - n) / 86400000);
};
const addMonths = (dateStr, months) => {
  const d = new Date(dateStr);
  d.setMonth(d.getMonth() + Number(months));
  return d.toISOString().split("T")[0];
};
function getPeriodItems(items, period, dateKey) {
  const now = new Date();
  return items.filter(l => {
    const d = new Date(l[dateKey||"createdAt"]);
    if (isNaN(d)) return false;
    if (period==="daily")   return d.toDateString()===now.toDateString();
    if (period==="weekly")  return (now-d)<=7*86400000;
    if (period==="monthly") return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    if (period==="quarter") return Math.floor(d.getMonth()/3)===Math.floor(now.getMonth()/3)&&d.getFullYear()===now.getFullYear();
    if (period==="half")    return (now-d)<=182*86400000;
    if (period==="yearly")  return d.getFullYear()===now.getFullYear();
    return true;
  });
}

// ════════════════ JSONP (global) ════════════════
function jsonpCall(params) {
  return new Promise((resolve, reject) => {
    const cbName = "cb_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    const timeout = setTimeout(() => {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error("timeout"));
    }, 25000);
    window[cbName] = (data) => {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      resolve(data);
    };
    const qs = new URLSearchParams({...params, callback: cbName}).toString();
    script.src = SCRIPT_URL + "?" + qs;
    script.onerror = () => { clearTimeout(timeout); reject(new Error("network")); };
    document.head.appendChild(script);
  });
}

// تنبيهات المواعيد
function getLeadAlerts(lead) {
  const alerts = [];
  const checks = [
    { key:"meetingDate",  label:"اجتماع",    icon:"📅" },
    { key:"proposalDate", label:"إرسال عرض", icon:"📄" },
    { key:"closingDate",  label:"تقفيل عقد", icon:"✍️" },
    { key:"followUpDate", label:"متابعة",    icon:"🔄" },
  ];
  checks.forEach(c => {
    const du = daysUntil(lead[c.key]);
    if (du === null) return;
    if (["won","lost"].includes(lead.salesStage)) return;
    if (du < 0)       alerts.push({ ...c, days:du, level:"overdue", text:`${c.icon} ${c.label} متأخر ${Math.abs(du)} يوم — ${lead.clientName||("عميل #"+lead.id)}` });
    else if (du === 0) alerts.push({ ...c, days:du, level:"today",  text:`${c.icon} ${c.label} اليوم — ${lead.clientName||("عميل #"+lead.id)}` });
    else if (du === 1) alerts.push({ ...c, days:du, level:"soon",   text:`${c.icon} ${c.label} بكرة — ${lead.clientName||("عميل #"+lead.id)}` });
  });
  return alerts;
}
function getRenewalAlert(r) {
  if (r.status !== "active") return null;
  const du = daysUntil(r.nextRenewalDate);
  if (du === null) return null;
  if (du < 0)   return { level:"overdue", days:du, color:T.danger, bg:T.dangerBg, text:`⚠️ تجديد ${r.clientName} متأخر ${Math.abs(du)} يوم!` };
  if (du <= 7)  return { level:"week",    days:du, color:T.danger, bg:T.dangerBg, text:`🔴 تجديد ${r.clientName} بعد ${du} يوم` };
  if (du <= 14) return { level:"twoweeks",days:du, color:T.warn,   bg:T.warnBg,   text:`🟠 تجديد ${r.clientName} بعد ${du} يوم` };
  if (du <= 30) return { level:"month",   days:du, color:"#ca8a04", bg:"#fefce8", text:`🟡 تجديد ${r.clientName} بعد ${du} يوم` };
  return null;
}

// ════════════════ LOGIN (من الشيت + تذكرني + فولباك) ════════════════
function LoginScreen({onLogin}) {
  const saved = (()=>{ try { return JSON.parse(localStorage.getItem("maawan_creds")||"null"); } catch(e){ return null; } })();
  const [u,setU]=useState(saved?.u||"");
  const [p,setP]=useState(saved?.p||"");
  const [remember,setRemember]=useState(!!saved);
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);

  const handle = async () => {
    setBusy(true); setErr("");
    let user = null;
    try {
      const res = await jsonpCall({ action:"login", username:u, password:p });
      if (res.success && res.user) user = res.user;
      else if (res.error) setErr(res.error);
    } catch(e) {
      // فولباك طوارئ: حساب المدير المدمج
      if (u===FALLBACK_MANAGER.username && p===FALLBACK_MANAGER.password) user = FALLBACK_MANAGER;
      else setErr("مشكلة في الاتصال بالسيرفر — جرب تاني");
    }
    if (!user && !err) setErr("اسم المستخدم أو كلمة المرور غلط");
    if (user) {
      if (remember) { try { localStorage.setItem("maawan_creds", JSON.stringify({u,p})); } catch(e){} }
      else { try { localStorage.removeItem("maawan_creds"); } catch(e){} }
      onLogin(user);
    }
    setBusy(false);
  };

  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#eef2ff 0%,#f4f5fa 50%,#fdf4ff 100%)",padding:16}}>

        <h1 style={{color:T.primary,fontSize:24,fontWeight:800,margin:"0 0 4px"}}>معوان CRM</h1>
        <p style={{color:T.textSoft,fontSize:13,margin:"0 0 28px"}}>مبيعات · تجديدات · حسابات · واتساب</p>
        {err && <div style={{background:T.dangerBg,border:`1px solid #fecaca`,borderRadius:8,padding:"10px 14px",color:T.danger,fontSize:13,marginBottom:14}}>{err}</div>}
        <input value={u} onChange={e=>setU(e.target.value)} placeholder="اسم المستخدم" style={{...inputS,marginBottom:10,padding:"12px 14px"}}/>
        <input value={p} onChange={e=>setP(e.target.value)} type="password" placeholder="كلمة المرور" onKeyDown={e=>e.key==="Enter"&&handle()} style={{...inputS,marginBottom:12,padding:"12px 14px"}}/>
        <label style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:T.textSoft,marginBottom:16,cursor:"pointer",justifyContent:"flex-start"}}>
          <input type="checkbox" checked={remember} onChange={e=>setRemember(e.target.checked)} style={{width:16,height:16,accentColor:T.primary}}/>
          تذكرني — احفظ بيانات الدخول
        </label>
        <button onClick={handle} disabled={busy} style={{...btnPrimary,width:"100%",padding:"13px",fontSize:15,opacity:busy?0.7:1}}>{busy?"⏳ جارٍ الدخول...":"دخول"}</button>

          </Field>
          {inp("الإيميل","email","email","example@mail.com")}
          {inp("رابط المتجر","storeUrl","text","store.salla.sa")}
          {sel("النيتش","niche",NICHES)}

function RenewalModal({renewal,user,onSave,onClose}) {
  const isNew = !renewal;
  const blank = {
    id:"R"+Date.now(), clientName:"", phone:"", phoneCountry:"+966",
    contractValue:"", currency:"SAR", cycle:1,
    startDate:today(), nextRenewalDate:addMonths(today(),1),
    contractUrl:"", reportUrls:"", accountManager:user.role==="account_manager"?user.id:"",
    status:"active", notes:"", createdAt:today(), updatedAt:today()
  };
  const [form,setForm]=useState(renewal?{...blank,...renewal}:blank);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  const handleCycleOrStart = (key,val) => {
    const next = {...form,[key]:val};
    if (next.startDate && next.cycle) next.nextRenewalDate = addMonths(next.startDate, next.cycle);
    setForm(next);
  };

  const markRenewed = () => {
    const next = addMonths(form.nextRenewalDate||today(), form.cycle);
    setForm(f=>({...f, nextRenewalDate:next, status:"active"}));
  };

  const handleSave = () => {
    if (!form.clientName){alert("اسم العميل مطلوب");return;}
    onSave({...form,updatedAt:today()});
  };

  const grid2 = {display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:"0 14px"};
  return (
    <Modal title={isNew?"➕ عقد جديد للتجديدات":"✏️ تعديل عقد"} onClose={onClose} maxWidth={640}>
      <div style={grid2}>
        <Field label="اسم العميل"><input value={form.clientName} onChange={e=>set("clientName",e.target.value)} style={inputS}/></Field>
        <Field label="رقم الهاتف">

        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:8}}>
          <Field label="قيمة العقد"><input type="number" value={form.contractValue} onChange={e=>set("contractValue",e.target.value)} style={inputS}/></Field>
          <Field label="العملة">
            <select value={form.currency} onChange={e=>set("currency",e.target.value)} style={inputS}>
              <option>SAR</option><option>EGP</option><option>USD</option>
            </select>
          </Field>
        </div>
        <Field label="دورة الدفع">
          <select value={form.cycle} onChange={e=>handleCycleOrStart("cycle",Number(e.target.value))} style={inputS}>
            {CYCLES.map(c=><option key={c.v} value={c.v}>{c.l}</option>)}
          </select>
        </Field>
        <Field label="تاريخ بداية العقد"><input type="date" value={form.startDate} onChange={e=>handleCycleOrStart("startDate",e.target.value)} style={inputS}/></Field>

        <Field label="الأكونت مانجر">
          <select value={form.accountManager} onChange={e=>set("accountManager",e.target.value)} style={inputS}>
            <option value="">— اختر —</option>
            {USERS.filter(u=>["account_manager","am_team_leader"].includes(u.role)).map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
          </select>
        </Field>
        <Field label="الحالة">
          <select value={form.status} onChange={e=>set("status",e.target.value)} style={inputS}>
            <option value="active">🟢 نشط</option>
            <option value="paused">⏸️ متوقف مؤقت</option>
            <option value="cancelled">🔴 ملغي</option>
          </select>
        </Field>
      </div>
      <Field label="رابط العقد (جوجل درايف)"><input type="url" value={form.contractUrl} onChange={e=>set("contractUrl",e.target.value)} placeholder="https://drive.google.com/..." style={inputS}/></Field>
      <Field label="روابط التقارير (رابط في كل سطر)"><textarea value={form.reportUrls} onChange={e=>set("reportUrls",e.target.value)} rows={3} placeholder="تقارير الأداء اللي بنعرضها وقت التجديد" style={{...inputS,resize:"vertical"}}/></Field>
      <Field label="ملاحظات"><textarea value={form.notes} onChange={e=>set("notes",e.target.value)} rows={2} style={{...inputS,resize:"vertical"}}/></Field>

      {!isNew && (
        <button onClick={markRenewed} style={{...btnGhost,background:T.okBg,color:T.ok,border:"1px solid #a7f3d0",width:"100%",marginBottom:10,fontWeight:700}}>
          ✅ العميل جدّد — رحّل تاريخ التجديد للدورة الجاية
        </button>
      )}

      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <button onClick={onClose} style={btnGhost}>إلغاء</button>
        <button onClick={handleSave} style={btnPrimary}>💾 حفظ</button>
      </div>
    </Modal>
  );
}

// ════════════════ FINANCE TAB (مدير فقط) ════════════════
function FinanceTab({expenses,collections,settings,onAddExpense,onEditExpense,onDeleteExpense,onAddCollection,onEditCollection,onDeleteCollection,onSaveSettings,period,setPeriod}) {
  const [sub,setSub]=useState("overview");
  const [showExp,setShowExp]=useState(false);
  const [showCol,setShowCol]=useState(false);
  const [editExp,setEditExp]=useState(null);
  const [editCol,setEditCol]=useState(null);
  const [officeP,setOfficeP]=useState(settings.officePercent??10);
  const [taxP,setTaxP]=useState(settings.taxPercent??14);

  useEffect(()=>{ setOfficeP(settings.officePercent??10); setTaxP(settings.taxPercent??14); },[settings]);

  const pCollections = getPeriodItems(collections, period, "date");
  const pExpenses = expenses.filter(e=>{
    if (period==="monthly") return e.month===thisMonth();
    if (period==="yearly"||period==="half"||period==="quarter") {
      const y = new Date().getFullYear();
      return (e.month||"").startsWith(String(y));
    }
    return true;
  });

  const gross = pCollections.reduce((s,c)=>s+Number(c.amount||0),0);
  const afterOffice = gross * (1 - officeP/100);
  const afterTax = gross * (1 - taxP/100);
  const afterBoth = gross * (1 - officeP/100 - taxP/100);
  const totalExpenses = pExpenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const netProfit = afterBoth - totalExpenses;

  const PERIODS=[{id:"monthly",label:"هذا الشهر"},{id:"quarter",label:"هذا الربع"},{id:"half",label:"نصف العام"},{id:"yearly",label:"هذا العام"},{id:"all",label:"الكل"}];
  const SUBS=[{id:"overview",label:"📊 نظرة عامة"},{id:"collections",label:"💰 التحصيلات"},{id:"expenses",label:"📤 المصاريف"},{id:"settings",label:"⚙️ النسب"}];

  return (
    <div>
      <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
        {SUBS.map(s=><button key={s.id} onClick={()=>setSub(s.id)} style={{padding:"8px 18px",borderRadius:10,border:"none",cursor:"pointer",fontSize:13,fontWeight:700,background:sub===s.id?T.primary:"#fff",color:sub===s.id?"#fff":T.textSoft,boxShadow:T.shadow}}>{s.label}</button>)}
      </div>

      {sub!=="settings" && (
        <div style={{display:"flex",gap:8,marginBottom:18,flexWrap:"wrap"}}>
          {PERIODS.map(p=><button key={p.id} onClick={()=>setPeriod(p.id)} style={{padding:"6px 14px",borderRadius:20,border:`1px solid ${period===p.id?T.primary:T.cardBorder}`,cursor:"pointer",fontSize:12,fontWeight:600,background:period===p.id?T.primary:"#fff",color:period===p.id?"#fff":T.textSoft}}>{p.label}</button>)}
        </div>
      )}

      {sub==="overview" && (
        <div>
          <div className="stat-cards" style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:14}}>
            <StatCard label="إجمالي المُحصَّل (Gross)" value={fmt(gross)} icon="💰" color={T.accent}/>
            <StatCard label={`بعد خصم مكتب السعودية ${officeP}%`} value={fmt(afterOffice)} icon="🏢" color="#7c3aed"/>
            <StatCard label={`بعد خصم الضريبة ${taxP}%`} value={fmt(afterTax)} icon="🧾" color={T.warn}/>
            <StatCard label={`بعد الخصمين (${officeP}% + ${taxP}%)`} value={fmt(afterBoth)} icon="⚖️" color="#0369a1"/>
          </div>
          <div className="stat-cards" style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:20}}>
            <StatCard label="إجمالي المصاريف" value={fmt(totalExpenses)} icon="📤" color={T.danger}/>
            <StatCard label={netProfit>=0?"صافي الربح ✅":"صافي الخسارة ⚠️"} value={fmt(Math.abs(netProfit))}
              sub={netProfit>=0?"الشركة كسبانة":"الشركة خسرانة"} icon={netProfit>=0?"📈":"📉"} color={netProfit>=0?T.ok:T.danger}/>
          </div>
          <div style={{background:T.card,borderRadius:14,padding:20,boxShadow:T.shadow}}>
            <p style={{color:T.textSoft,fontSize:12,fontWeight:700,marginBottom:14}}>المصاريف حسب التصنيف</p>
            {EXPENSE_CATS.map(cat=>{
              const catTotal = pExpenses.filter(e=>e.category===cat).reduce((s,e)=>s+Number(e.amount||0),0);
              if (catTotal===0) return null;
              return <div key={cat} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{color:T.text,fontSize:13}}>{cat}</span>
                  <span style={{color:T.danger,fontWeight:700,fontSize:13}}>{fmt(catTotal)}</span>
                </div>
                <div style={{height:5,background:"#f1f5f9",borderRadius:3}}>
                  <div style={{height:"100%",width:`${totalExpenses?(catTotal/totalExpenses*100):0}%`,background:T.danger,borderRadius:3}}/>
                </div>
              </div>;
            })}
            {totalExpenses===0 && <p style={{color:T.textMuted,fontSize:12}}>لا يوجد مصاريف في الفترة دي</p>}
          </div>
        </div>
      )}

      {sub==="collections" && (
        <div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:14,alignItems:"center"}}>
            <h3 style={{color:T.text,fontSize:15,margin:0}}>التحصيلات ({pCollections.length}) — {fmt(gross)}</h3>
            <button onClick={()=>{setEditCol(null);setShowCol(true);}} style={btnPrimary}>➕ إضافة تحصيل</button>
          </div>
          <div style={{background:T.card,borderRadius:14,overflow:"hidden",boxShadow:T.shadow}}>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                <thead><tr style={{background:"#f8fafc",color:T.textSoft,fontSize:11}}>

                  <th style={{textAlign:"right",padding:"11px 14px"}}>العميل</th>
                  <th style={{textAlign:"right",padding:"11px 14px"}}>النوع</th>
                  <th style={{textAlign:"right",padding:"11px 14px"}}>المبلغ</th>

// ════════════════ WHATSAPP TAB ════════════════
function WhatsAppTab({user,instances,funnel,quickReplies,leads,onOpenLead,onCreateLeadFromChat}) {
  const [chats,setChats]=useState([]);
  const [activeChat,setActiveChat]=useState(null);
  const [messages,setMessages]=useState([]);
  const [text,setText]=useState("");
  const [waSearch,setWaSearch]=useState("");
  const [fStatus,setFStatus]=useState("");
  const [fInst,setFInst]=useState("");
  const [showFavs,setShowFavs]=useState(false);
  const [favMsgs,setFavMsgs]=useState([]);
  const [showNew,setShowNew]=useState(false);
  const [busy,setBusy]=useState(false);
  const [loadingChats,setLoadingChats]=useState(true);
  const msgsEndRef = useRef(null);
  const activeChatRef = useRef(null);
  activeChatRef.current = activeChat;

  const loadChats = useCallback(async () => {
    try {
      const res = await jsonpCall({ action:"getChats", userId:user.id });
      if (res.success) setChats(res.chats||[]);
    } catch(e){ console.error(e); }
    setLoadingChats(false);
  },[user.id]);

  const loadMessages = useCallback(async (chatId, markRead=true) => {
    try {
      const res = await jsonpCall({ action:"getMessages", chatId, markRead: markRead?"1":"0", userId:user.id });
      if (res.success) {
        setMessages(res.messages||[]);
        if (markRead) setChats(prev=>prev.map(c=>c.chat_id===chatId?{...c,unread:0}:c));
      }
    } catch(e){ console.error(e); }
  },[user.id]);

  // تحميل أولي + تحديث تلقائي كل 20 ثانية
  useEffect(()=>{
    loadChats();
    const iv = setInterval(()=>{
      loadChats();
      if (activeChatRef.current) loadMessages(activeChatRef.current.chat_id, false);
    }, 20000);
    return ()=>clearInterval(iv);
  },[loadChats,loadMessages]);

  useEffect(()=>{ if(msgsEndRef.current) msgsEndRef.current.scrollIntoView({behavior:"smooth"}); },[messages]);

  const openChat = (c) => { setActiveChat(c); setShowFavs(false); loadMessages(c.chat_id); };

  const send = async () => {
    if (!text.trim()||!activeChat) return;
    const t = text.trim(); setText(""); setBusy(true);
    // إضافة فورية للواجهة
    const tempMsg = { id:"tmp"+Date.now(), chat_id:activeChat.chat_id, direction:"out", text:t, ts:new Date().toISOString(), agent:user.name, fav:false };
    setMessages(prev=>[...prev,tempMsg]);
    try {
      const res = await jsonpCall({ action:"sendWA", instanceId:activeChat.instance_id, chatId:activeChat.chat_id, text:t, agentId:user.id, agentName:user.name });
      if (!res.success) alert("❌ فشل الإرسال: "+(res.error||""));
    } catch(e){ alert("❌ مشكلة في الاتصال"); }
    setBusy(false);
  };

  const sendNew = async (instanceId, chatId, t) => {
    try {
      const res = await jsonpCall({ action:"sendWA", instanceId, chatId, text:t, agentId:user.id, agentName:user.name });
      if (res.success) { await loadChats(); }
      else alert("❌ "+(res.error||"فشل الإرسال"));
    } catch(e){ alert("❌ مشكلة في الاتصال"); }
  };

  const toggleFav = async (m) => {
    setMessages(prev=>prev.map(x=>x.id===m.id?{...x,fav:!x.fav}:x));
    try { await jsonpCall({ action:"toggleFavMsg", id:m.id }); } catch(e){}
  };

  const setChatFunnel = async (c, statusId) => {
    setChats(prev=>prev.map(x=>x.chat_id===c.chat_id?{...x,funnel:statusId}:x));
    if (activeChat?.chat_id===c.chat_id) setActiveChat(a=>({...a,funnel:statusId}));
    try { await jsonpCall({ action:"setChatStatus", chatId:c.chat_id, status:statusId }); } catch(e){}
  };

  const loadFavs = async () => {
    setShowFavs(true); setActiveChat(null);
    try {
      const res = await jsonpCall({ action:"getFavMessages", userId:user.id });
      if (res.success) setFavMsgs(res.messages||[]);
    } catch(e){}
  };

  const linkedLead = activeChat ? leads.find(l=>String(l.id)===String(activeChat.leadId)) ||
    leads.find(l=>normPhone(l.phone) && chatIdToPhone(activeChat.chat_id).endsWith(normPhone(l.phone))) : null;

  const filteredChats = chats.filter(c=>{
    const q = waSearch.toLowerCase();
    const mq = !q || (c.name||"").toLowerCase().includes(q) || (c.chat_id||"").includes(q) || (c.lastMsgText||"").toLowerCase().includes(q);
    return mq && (!fStatus||c.funnel===fStatus) && (!fInst||c.instance_id===fInst);
  }).sort((a,b)=>new Date(b.lastMsgAt||0)-new Date(a.lastMsgAt||0));

  const totalUnread = chats.reduce((s,c)=>s+Number(c.unread||0),0);
  const showAllInst = can.allChats(user);

  const chip = (label,color,active,onClick) => (
    <button onClick={onClick} style={{padding:"4px 12px",borderRadius:20,border:`1px solid ${active?color:T.cardBorder}`,cursor:"pointer",fontSize:11,fontWeight:700,background:active?color:"#fff",color:active?"#fff":T.textSoft,whiteSpace:"nowrap"}}>{label}</button>
  );

  return (
    <div>
      <div style={{display:"flex",gap:10,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
        <h2 style={{margin:0,fontSize:17,color:T.text}}>💬 الواتساب {totalUnread>0&&<span style={{background:T.danger,color:"#fff",borderRadius:20,padding:"2px 10px",fontSize:12,marginRight:6}}>{totalUnread}</span>}</h2>
        <div style={{flex:1}}/>
        <button onClick={loadFavs} style={{...btnGhost,padding:"7px 14px",fontSize:12,background:showFavs?"#fefce8":"#fff",borderColor:showFavs?"#eab308":T.cardBorder,color:showFavs?"#a16207":T.textSoft,fontWeight:700}}>⭐ المفضلة</button>
        <button onClick={()=>setShowNew(true)} style={btnPrimary}>✉️ محادثة جديدة</button>
      </div>

      {/* فلاتر */}
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
        <input value={waSearch} onChange={e=>setWaSearch(e.target.value)} placeholder="🔍 بحث بالاسم أو الرقم أو النص..." style={{...inputS,width:"auto",minWidth:200,padding:"7px 12px",fontSize:12}}/>
        {chip("الكل","#64748b",!fStatus,()=>setFStatus(""))}
        {funnel.map(f=>chip(f.label,f.color,fStatus===f.id,()=>setFStatus(fStatus===f.id?"":f.id)))}
        {showAllInst && instances.length>1 && (
          <select value={fInst} onChange={e=>setFInst(e.target.value)} style={{...inputS,width:"auto",padding:"6px 10px",fontSize:12}}>
            <option value="">كل الأرقام</option>
            {instances.map(i=><option key={i.id} value={i.id}>{i.label||i.id}</option>)}
          </select>
        )}
      </div>

      <div className="wa-layout" style={{display:"flex",gap:12,height:"calc(100vh - 240px)",minHeight:400}}>
        {/* قائمة المحادثات */}
        <div className="wa-list-panel" style={{width:330,flexShrink:0,background:T.card,borderRadius:14,boxShadow:T.shadow,overflowY:"auto"}}>
          {loadingChats && <p style={{color:T.textMuted,textAlign:"center",padding:30,fontSize:13}}>⏳ جارٍ التحميل...</p>}
          {!loadingChats && filteredChats.length===0 && <p style={{color:T.textMuted,textAlign:"center",padding:30,fontSize:13}}>لا يوجد محادثات{fStatus||waSearch?" مطابقة":""} بعد<br/><span style={{fontSize:11}}>الرسايل الجاية هتظهر هنا تلقائياً</span></p>}
          {filteredChats.map(c=>{
            const f = funnel.find(x=>x.id===c.funnel);
            const inst = instances.find(i=>i.id===c.instance_id);
            const lead = leads.find(l=>String(l.id)===String(c.leadId));
            return (
              <div key={c.chat_id} onClick={()=>openChat(c)} style={{padding:"12px 14px",borderBottom:`1px solid ${T.cardBorder}`,cursor:"pointer",background:activeChat?.chat_id===c.chat_id?T.accentBg:"transparent"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                  <div style={{fontWeight:700,fontSize:13,color:T.text,display:"flex",alignItems:"center",gap:5,overflow:"hidden"}}>
                    {f&&<span style={{width:8,height:8,borderRadius:"50%",background:f.color,flexShrink:0}}/>}
                    <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{lead?.clientName||c.name||chatIdToPhone(c.chat_id)}</span>
                    {lead&&<span title="مربوط بليد" style={{fontSize:10}}>🔗</span>}
                  </div>
                  <span style={{color:T.textMuted,fontSize:10,flexShrink:0}}>{timeAgo(c.lastMsgAt)}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{color:T.textSoft,fontSize:11,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{c.lastMsgText||""}</div>
                  {Number(c.unread)>0&&<span style={{background:T.ok,color:"#fff",borderRadius:12,padding:"1px 7px",fontSize:10,fontWeight:800,flexShrink:0,marginRight:6}}>{c.unread}</span>}
                </div>
                {showAllInst&&<div style={{color:T.textMuted,fontSize:10,marginTop:2}}>📱 {inst?.label||c.instance_id}</div>}
              </div>
            );
          })}
        </div>

        {/* نافذة الشات / المفضلة */}
        <div style={{flex:1,background:T.card,borderRadius:14,boxShadow:T.shadow,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          {showFavs ? (
            <div style={{padding:16,overflowY:"auto"}}>
              <p style={{fontWeight:800,fontSize:14,color:"#a16207",marginBottom:14}}>⭐ الرسايل المفضلة ({favMsgs.length})</p>
              {favMsgs.length===0&&<p style={{color:T.textMuted,fontSize:13}}>معلّمتش رسايل لسه — دوس على ⭐ جنب أي رسالة مهمة</p>}
              {favMsgs.map(m=>{
                const c = chats.find(x=>x.chat_id===m.chat_id);
                return (
                  <div key={m.id} onClick={()=>{ if(c) openChat(c); }} style={{background:"#fefce8",border:"1px solid #fde68a",borderRadius:10,padding:"10px 14px",marginBottom:8,cursor:c?"pointer":"default"}}>
                    <div style={{fontSize:11,color:"#a16207",fontWeight:700,marginBottom:3}}>{c?.name||chatIdToPhone(m.chat_id)} · {timeAgo(m.ts)} {m.direction==="out"?"· 📤 "+(m.agent||""):""}</div>
                    <div style={{fontSize:13,color:T.text}}>{m.text}</div>
                  </div>
                );
              })}
            </div>
          ) : !activeChat ? (
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",flexDirection:"column",gap:8}}>
              <div style={{fontSize:44}}>💬</div>
              <p style={{color:T.textMuted,fontSize:13}}>اختار محادثة من القائمة أو ابدأ محادثة جديدة</p>
            </div>
          ) : (
            <>
              {/* هيدر الشات */}
              <div style={{padding:"12px 16px",borderBottom:`1px solid ${T.cardBorder}`,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                <button className="hide-desktop" onClick={()=>setActiveChat(null)} style={{...btnGhost,padding:"4px 10px",fontSize:12}}>‹ رجوع</button>
                <div style={{flex:1,minWidth:120}}>
                  <div style={{fontWeight:800,fontSize:14,color:T.text}}>{linkedLead?.clientName||activeChat.name||chatIdToPhone(activeChat.chat_id)}</div>
                  <div style={{color:T.textMuted,fontSize:11,direction:"ltr",textAlign:"right"}}>+{chatIdToPhone(activeChat.chat_id)}</div>
                </div>
                <select value={activeChat.funnel||""} onChange={e=>setChatFunnel(activeChat,e.target.value)} style={{...inputS,width:"auto",padding:"6px 10px",fontSize:12,fontWeight:700,color:funnel.find(f=>f.id===activeChat.funnel)?.color||T.textSoft}}>
                  <option value="">— بدون حالة —</option>
                  {funnel.map(f=><option key={f.id} value={f.id}>{f.label}</option>)}
                </select>
                {linkedLead
                  ? <button onClick={()=>onOpenLead(linkedLead)} style={{...btnGhost,padding:"6px 12px",fontSize:12,color:T.accent,borderColor:"#c7d2fe",background:T.accentBg,fontWeight:700}}>🔗 فتح الليد</button>
                  : <button onClick={()=>onCreateLeadFromChat(activeChat)} style={{...btnGhost,padding:"6px 12px",fontSize:12,color:T.ok,borderColor:"#a7f3d0",background:T.okBg,fontWeight:700}}>➕ تحويل لليد</button>}
              </div>

              {/* الرسايل */}
              <div style={{flex:1,overflowY:"auto",padding:16,background:"#f8f9fd"}}>
                {messages.map(m=>(
                  <div key={m.id} style={{display:"flex",justifyContent:m.direction==="out"?"flex-start":"flex-end",marginBottom:8}}>
                    <div style={{maxWidth:"75%",padding:"9px 13px",borderRadius:m.direction==="out"?"12px 12px 12px 3px":"12px 12px 3px 12px",
                      background:m.direction==="out"?T.primary:"#fff",color:m.direction==="out"?"#fff":T.text,
                      boxShadow:"0 1px 2px rgba(0,0,0,0.08)",position:"relative",fontSize:13,lineHeight:1.5}}>
                      {m.text}
                      <div style={{display:"flex",gap:8,alignItems:"center",marginTop:4,justifyContent:"space-between"}}>
                        <span style={{fontSize:9,opacity:0.65}}>{timeAgo(m.ts)}{m.direction==="out"&&m.agent?" · "+m.agent:""}</span>
                        <button onClick={()=>toggleFav(m)} title="مفضلة" style={{background:"none",border:"none",cursor:"pointer",fontSize:12,opacity:m.fav?1:0.35,padding:0}}>⭐</button>
                      </div>
                    </div>
                  </div>
                ))}
                <div ref={msgsEndRef}/>
              </div>

              {/* الإرسال */}
              <div style={{padding:"10px 14px",borderTop:`1px solid ${T.cardBorder}`,display:"flex",gap:8,alignItems:"flex-end"}}>
                {quickReplies.length>0&&(
                  <select value="" onChange={e=>{ if(e.target.value) setText(t=>t?t+" "+e.target.value:e.target.value); }} style={{...inputS,width:44,padding:"9px 6px",fontSize:14,flexShrink:0}} title="ردود جاهزة">
                    <option value="">⚡</option>
                    {quickReplies.map(q=><option key={q.id} value={q.text}>{q.title}</option>)}
                  </select>
                )}
                <textarea value={text} onChange={e=>setText(e.target.value)} rows={1} placeholder="اكتب رسالتك..."
                  onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();} }}
                  style={{...inputS,flex:1,resize:"none",maxHeight:100}}/>
                <button onClick={send} disabled={busy} style={{...btnPrimary,padding:"10px 18px",opacity:busy?0.7:1,flexShrink:0}}>📤</button>
              </div>
            </>
          )}
        </div>
      </div>

      {showNew&&<NewChatModal instances={instances} user={user} onSend={sendNew} onClose={()=>setShowNew(false)}/>}
    </div>
  );
}

// ════════════════ RULES TAB (المدير فقط) ════════════════
function RulesTab({users,instances,funnel,quickReplies,onSaveUser,onSaveInstances,onSaveFunnel,onSaveQR,onDeleteQR}) {
  const [sub,setSub]=useState("users");
  const [edits,setEdits]=useState({});
  const [newInstId,setNewInstId]=useState("");
  const [newInstLabel,setNewInstLabel]=useState("");
  const [newFunnel,setNewFunnel]=useState({label:"",color:"#4f46e5"});
  const [newQR,setNewQR]=useState({title:"",text:""});

  const getU = (u) => edits[u.id] ? edits[u.id] : u;
  const setU = (id, patch) => setEdits(prev=>({...prev,[id]:{...(prev[id]||users.find(x=>x.id===id)),...patch}}));

  const blankUser = () => ({ id:"u"+Date.now(), username:"", password:"", name:"", role:"sales", instances:[], perms:{}, active:true, _new:true });

  const SUBS=[{id:"users",label:"👥 الموظفون والصلاحيات"},{id:"instances",label:"📱 الأرقام"},{id:"funnel",label:"🎯 حالات الفانل"},{id:"qr",label:"⚡ الردود الجاهزة"}];

  return (
    <div>
      <div style={{display:"flex",gap:8,marginBottom:18,flexWrap:"wrap"}}>
        {SUBS.map(s=><button key={s.id} onClick={()=>setSub(s.id)} style={{padding:"8px 16px",borderRadius:10,border:"none",cursor:"pointer",fontSize:13,fontWeight:700,background:sub===s.id?T.primary:"#fff",color:sub===s.id?"#fff":T.textSoft,boxShadow:T.shadow}}>{s.label}</button>)}
      </div>

      {sub==="users"&&(
        <div>
          <button onClick={()=>{const nu=blankUser();setEdits(p=>({...p,[nu.id]:nu}));}} style={{...btnPrimary,marginBottom:14}}>➕ إضافة موظف</button>
          <div style={{display:"grid",gap:12}}>
            {[...users.map(u=>u.id),...Object.keys(edits).filter(id=>edits[id]?._new)].filter((v,i,a)=>a.indexOf(v)===i).map(id=>{
              const u = getU(users.find(x=>x.id===id)||edits[id]);
              if (!u) return null;
              return (
                <div key={id} style={{background:T.card,borderRadius:14,padding:16,boxShadow:T.shadow,border:u._new?`2px dashed ${T.accent}`:`1px solid ${T.cardBorder}`}}>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:10,marginBottom:10}}>
                    <Field label="الاسم"><input value={u.name||""} onChange={e=>setU(id,{name:e.target.value})} style={inputS}/></Field>
                    <Field label="اسم المستخدم"><input value={u.username||""} onChange={e=>setU(id,{username:e.target.value})} style={{...inputS,direction:"ltr"}}/></Field>
                    <Field label="كلمة المرور"><input value={u.password||""} onChange={e=>setU(id,{password:e.target.value})} style={{...inputS,direction:"ltr"}}/></Field>
                    <Field label="البوزيشن">
                      <select value={u.role} onChange={e=>setU(id,{role:e.target.value})} style={inputS}>
                        {Object.keys(ROLES).map(r=><option key={r} value={r}>{ROLES[r].label}</option>)}
                      </select>
                    </Field>
                  </div>
                  <Field label="📱 الأرقام المسموحة (الموظف مش هيشوف غيرهم)">
                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                      {instances.length===0&&<span style={{color:T.textMuted,fontSize:12}}>ضيف أرقام من تاب "الأرقام" الأول</span>}
                      {instances.map(inst=>{
                        const checked = (u.instances||[]).includes(inst.id);
                        return <label key={inst.id} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,background:checked?T.accentBg:"#f8fafc",border:`1px solid ${checked?"#c7d2fe":T.cardBorder}`,borderRadius:8,padding:"6px 10px",cursor:"pointer",fontWeight:600,color:checked?T.accent:T.textSoft}}>
                          <input type="checkbox" checked={checked} onChange={e=>{
                            const cur = new Set(u.instances||[]);
                            e.target.checked?cur.add(inst.id):cur.delete(inst.id);
                            setU(id,{instances:[...cur]});
                          }} style={{accentColor:T.primary}}/>
                          {inst.label||inst.id}
                        </label>;
                      })}
                    </div>
                  </Field>
                  <Field label="🔐 الصلاحيات">
                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                      {PERM_DEFS.map(p=>{
                        const val = (u.perms&&u.perms[p.key]!==undefined&&u.perms[p.key]!=="")?!!u.perms[p.key]:roleDefault[p.key](u.role);
                        return <label key={p.key} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,background:val?T.okBg:"#f8fafc",border:`1px solid ${val?"#a7f3d0":T.cardBorder}`,borderRadius:8,padding:"6px 10px",cursor:"pointer",fontWeight:600,color:val?T.ok:T.textSoft}}>
                          <input type="checkbox" checked={val} onChange={e=>setU(id,{perms:{...(u.perms||{}),[p.key]:e.target.checked}})} style={{accentColor:T.ok}}/>
                          {p.label}
                        </label>;
                      })}
                    </div>
                  </Field>
                  <div style={{display:"flex",gap:8,alignItems:"center",justifyContent:"space-between",flexWrap:"wrap"}}>
                    <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,fontWeight:700,color:u.active!==false?T.ok:T.danger,cursor:"pointer"}}>
                      <input type="checkbox" checked={u.active!==false} onChange={e=>setU(id,{active:e.target.checked})} style={{accentColor:T.ok}}/>
                      {u.active!==false?"نشط ✅":"موقوف ⛔"}
                    </label>
                    <button onClick={async()=>{
                      if(!u.username||!u.password||!u.name){alert("كمّل الاسم واليوزر والباسورد");return;}
                      const clean={...u}; delete clean._new;
                      await onSaveUser(clean);
                      setEdits(p=>{const n={...p};delete n[id];return n;});
                    }} style={btnPrimary}>💾 حفظ</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {sub==="instances"&&(
        <div style={{maxWidth:560}}>
          <div style={{background:T.card,borderRadius:14,padding:18,boxShadow:T.shadow,marginBottom:14}}>
            <p style={{fontWeight:700,fontSize:13,color:T.text,marginBottom:12}}>➕ إضافة رقم (Instance من Taayer)</p>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <Field label="Instance ID (زي: instance12004)"><input value={newInstId} onChange={e=>setNewInstId(e.target.value)} style={{...inputS,direction:"ltr"}} placeholder="instance12004"/></Field>
              <Field label="اسم واضح للفريق"><input value={newInstLabel} onChange={e=>setNewInstLabel(e.target.value)} style={inputS} placeholder="رقم مبيعات ١"/></Field>
            </div>
            <button onClick={()=>{
              if(!newInstId.trim())return;
              onSaveInstances([...instances,{id:newInstId.trim(),label:newInstLabel.trim()||newInstId.trim()}]);
              setNewInstId("");setNewInstLabel("");
            }} style={btnPrimary}>➕ إضافة</button>
          </div>
          {instances.map(inst=>(
            <div key={inst.id} style={{background:T.card,borderRadius:12,padding:"12px 16px",boxShadow:T.shadow,marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontWeight:700,fontSize:13,color:T.text}}>📱 {inst.label}</div>
                <div style={{color:T.textMuted,fontSize:11,direction:"ltr",textAlign:"right"}}>{inst.id}</div>
              </div>
              <button onClick={()=>{ if(confirm("حذف الرقم من السستم؟ (مش هيتحذف من Taayer)")) onSaveInstances(instances.filter(i=>i.id!==inst.id)); }} style={{...btnGhost,padding:"5px 12px",fontSize:12,color:T.danger}}>🗑️</button>
            </div>
          ))}
        </div>
      )}

      {sub==="funnel"&&(
        <div style={{maxWidth:560}}>
          <div style={{background:T.card,borderRadius:14,padding:18,boxShadow:T.shadow,marginBottom:14}}>
            <p style={{fontWeight:700,fontSize:13,color:T.text,marginBottom:12}}>➕ إضافة حالة جديدة للفانل</p>
            <div style={{display:"flex",gap:10,alignItems:"flex-end"}}>
              <div style={{flex:1}}><Field label="الاسم"><input value={newFunnel.label} onChange={e=>setNewFunnel(f=>({...f,label:e.target.value}))} style={inputS} placeholder="مثال: عرض مُرسل"/></Field></div>
              <div><Field label="اللون"><input type="color" value={newFunnel.color} onChange={e=>setNewFunnel(f=>({...f,color:e.target.value}))} style={{width:60,height:40,border:"none",borderRadius:8,cursor:"pointer",background:"none"}}/></Field></div>
              <button onClick={()=>{
                if(!newFunnel.label.trim())return;
                onSaveFunnel([...funnel,{id:"f"+Date.now(),label:newFunnel.label.trim(),color:newFunnel.color}]);
                setNewFunnel({label:"",color:"#4f46e5"});
              }} style={{...btnPrimary,marginBottom:13}}>➕</button>
            </div>
          </div>
          {funnel.map(f=>(
            <div key={f.id} style={{background:T.card,borderRadius:12,padding:"12px 16px",boxShadow:T.shadow,marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{width:14,height:14,borderRadius:"50%",background:f.color}}/>
                <span style={{fontWeight:700,fontSize:13,color:T.text}}>{f.label}</span>
              </div>
              <button onClick={()=>{ if(confirm("حذف الحالة؟")) onSaveFunnel(funnel.filter(x=>x.id!==f.id)); }} style={{...btnGhost,padding:"5px 12px",fontSize:12,color:T.danger}}>🗑️</button>
            </div>
          ))}
        </div>
      )}

      {sub==="qr"&&(
        <div style={{maxWidth:640}}>
          <div style={{background:T.card,borderRadius:14,padding:18,boxShadow:T.shadow,marginBottom:14}}>
            <p style={{fontWeight:700,fontSize:13,color:T.text,marginBottom:12}}>➕ رد جاهز جديد (الموظف يبعته بضغطة ⚡)</p>
            <Field label="العنوان"><input value={newQR.title} onChange={e=>setNewQR(q=>({...q,title:e.target.value}))} style={inputS} placeholder="مثال: رسالة الافتتاح"/></Field>
            <Field label="نص الرسالة"><textarea value={newQR.text} onChange={e=>setNewQR(q=>({...q,text:e.target.value}))} rows={3} style={{...inputS,resize:"vertical"}} placeholder="السلام عليكم، معاك ... من شركة معوان..."/></Field>
            <button onClick={()=>{
              if(!newQR.title.trim()||!newQR.text.trim())return;
              onSaveQR({id:"q"+Date.now(),title:newQR.title.trim(),text:newQR.text.trim()});
              setNewQR({title:"",text:""});
            }} style={btnPrimary}>➕ إضافة</button>
          </div>
          {quickReplies.map(q=>(
            <div key={q.id} style={{background:T.card,borderRadius:12,padding:"12px 16px",boxShadow:T.shadow,marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <span style={{fontWeight:700,fontSize:13,color:T.text}}>⚡ {q.title}</span>
                <button onClick={()=>{ if(confirm("حذف الرد؟")) onDeleteQR(q.id); }} style={{...btnGhost,padding:"4px 10px",fontSize:12,color:T.danger}}>🗑️</button>
              </div>
              <div style={{color:T.textSoft,fontSize:12,whiteSpace:"pre-wrap"}}>{q.text}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ════════════════ MAIN APP ════════════════
function App() {
  const [currentUser,setCurrentUser]=useState(()=>{
    try { const u=localStorage.getItem("maawan_user"); return u?JSON.parse(u):null; } catch(e){return null;}
  });
  const [leads,setLeads]=useState([]);
  const [renewals,setRenewals]=useState([]);
  const [expenses,setExpenses]=useState([]);
  const [collections,setCollections]=useState([]);
  const [settings,setSettings]=useState({officePercent:10,taxPercent:14});
  const [instances,setInstances]=useState([]);
  const [funnel,setFunnel]=useState(DEFAULT_FUNNEL);
  const [quickReplies,setQuickReplies]=useState([]);
  const [usersList,setUsersList]=useState([]);
  const [waUnread,setWaUnread]=useState(0);
  const [loading,setLoading]=useState(false);
  const [tab,setTab]=useState("dashboard");
  const [search,setSearch]=useState("");
  const [fNiche,setFNiche]=useState("");
  const [fSource,setFSource]=useState("");
  const [fPriority,setFPriority]=useState("");
  const [fTeleStage,setFTeleStage]=useState("");
  const [fSalesStage,setFSalesStage]=useState("");
  const [editLead,setEditLead]=useState(null);
  const [showLeadModal,setShowLeadModal]=useState(false);
  const [activityLead,setActivityLead]=useState(null);
  const [editRenewal,setEditRenewal]=useState(null);
  const [showRenewalModal,setShowRenewalModal]=useState(false);
  const [period,setPeriod]=useState("monthly");
  const [showAlerts,setShowAlerts]=useState(false);
  const [alertsShown,setAlertsShown]=useState(false);

  const loadAll = useCallback(async (user) => {
    if (!user) return;
    setLoading(true);
    try {
      const data = await jsonpCall({ action:"getAll", userId:user.id, role:user.role });
      if (data.success) {
        setLeads(data.leads||[]);
        setRenewals(data.renewals||[]);
        if (data.users) { setUsersList(data.users); USERS.length=0; data.users.forEach(u=>USERS.push(u)); }
        if (data.instances) setInstances(data.instances);
        if (data.funnelStatuses && data.funnelStatuses.length) setFunnel(data.funnelStatuses);
        if (data.quickReplies) setQuickReplies(data.quickReplies);
        if (data.waUnread !== undefined) setWaUnread(Number(data.waUnread)||0);
        if (can.finance(user)) {
          setExpenses(data.expenses||[]);
          setCollections(data.collections||[]);
          if (data.settings) setSettings(data.settings);
        }
        try { localStorage.setItem("maawan_cache_"+user.id, JSON.stringify(data)); } catch(e){}
      }
    } catch(e) {
      console.error("loadAll:", e);
      try {
        const c = JSON.parse(localStorage.getItem("maawan_cache_"+user.id)||"null");
        if (c) {
          setLeads(c.leads||[]); setRenewals(c.renewals||[]);
          setExpenses(c.expenses||[]); setCollections(c.collections||[]);
          if(c.settings)setSettings(c.settings);
          if(c.instances)setInstances(c.instances);
          if(c.funnelStatuses&&c.funnelStatuses.length)setFunnel(c.funnelStatuses);
          if(c.quickReplies)setQuickReplies(c.quickReplies);
          if(c.users){setUsersList(c.users);USERS.length=0;c.users.forEach(u=>USERS.push(u));}
        }
      } catch(e2){}
    }
    setLoading(false);
  },[]);

  useEffect(()=>{ if(currentUser) loadAll(currentUser); },[currentUser,loadAll]);

  useEffect(()=>{
    if (!currentUser || alertsShown || (leads.length===0 && renewals.length===0)) return;
    const la = leads.flatMap(getLeadAlerts);
    const ra = renewals.map(getRenewalAlert).filter(Boolean);
    if (la.length>0 || ra.length>0) { setShowAlerts(true); setAlertsShown(true); }
  },[leads,renewals,currentUser,alertsShown]);

  const login = (user) => {
    try { localStorage.setItem("maawan_user", JSON.stringify(user)); } catch(e){}
    setCurrentUser(user); setAlertsShown(false);
  };
  const logout = () => {
    try { localStorage.removeItem("maawan_user"); } catch(e){}
    setCurrentUser(null); setLeads([]); setRenewals([]); setExpenses([]); setCollections([]);
  };

  const saveGeneric = async (action, key, payload) => {
    try { await jsonpCall({ action, [key]: JSON.stringify(payload) }); setTimeout(()=>loadAll(currentUser), 2000); }
    catch(e){ console.error(action, e); }
  };

  const handleSaveLead = (updated) => {
    setLeads(prev=>{const i=prev.findIndex(l=>l.id===updated.id);if(i>=0){const n=[...prev];n[i]=updated;return n;}return[updated,...prev];});
    setShowLeadModal(false); setEditLead(null);
    saveGeneric("saveLead","lead",updated);
  };
  const handleActivity = (leadId,entry) => {
    setLeads(prev=>prev.map(l=>l.id===leadId?{...l,activityLog:[...(l.activityLog||[]),entry],updatedAt:today()}:l));
    jsonpCall({ action:"addActivity", leadId, entry:JSON.stringify(entry), userId:currentUser.id }).catch(e=>console.error(e));
  };
  const handleSaveRenewal = (r) => {
    setRenewals(prev=>{const i=prev.findIndex(x=>x.id===r.id);if(i>=0){const n=[...prev];n[i]=r;return n;}return[r,...prev];});
    setShowRenewalModal(false); setEditRenewal(null);
    saveGeneric("saveRenewal","renewal",r);
  };
  const handleAddExpense = (x) => { setExpenses(p=>[x,...p]); saveGeneric("saveExpense","expense",x); };
  const handleEditExpense = (x) => { setExpenses(p=>p.map(e=>e.id===x.id?x:e)); saveGeneric("saveExpense","expense",x); };
  const handleDeleteExpense = (id) => { setExpenses(p=>p.filter(e=>e.id!==id)); jsonpCall({action:"deleteExpense",id}).catch(e=>console.error(e)); };
  const handleAddCollection = (x) => { setCollections(p=>[x,...p]); saveGeneric("saveCollection","collection",x); };
  const handleEditCollection = (x) => { setCollections(p=>p.map(e=>e.id===x.id?x:e)); saveGeneric("saveCollection","collection",x); };
  const handleDeleteCollection = (id) => { setCollections(p=>p.filter(e=>e.id!==id)); jsonpCall({action:"deleteCollection",id}).catch(e=>console.error(e)); };
  const handleSaveSettings = (s) => { setSettings(prev=>({...prev,...s})); jsonpCall({action:"saveSettings",settings:JSON.stringify(s)}).then(()=>alert("✅ تم الحفظ")).catch(e=>console.error(e)); };
  const handleSaveUser = async (u) => {
    setUsersList(prev=>{const i=prev.findIndex(x=>x.id===u.id);if(i>=0){const n=[...prev];n[i]=u;return n;}return[...prev,u];});
    try { await jsonpCall({action:"saveUser",user:JSON.stringify(u)}); alert("✅ تم حفظ "+u.name); } catch(e){ alert("❌ مشكلة في الحفظ"); }
  };
  const handleSaveInstances = (list) => { setInstances(list); jsonpCall({action:"saveSettings",settings:JSON.stringify({instances:list})}).catch(e=>console.error(e)); };
  const handleSaveFunnel = (list) => { setFunnel(list); jsonpCall({action:"saveSettings",settings:JSON.stringify({funnelStatuses:list})}).catch(e=>console.error(e)); };
  const handleSaveQR = (q) => { setQuickReplies(p=>[...p,q]); jsonpCall({action:"saveQuickReply",qr:JSON.stringify(q)}).catch(e=>console.error(e)); };
  const handleDeleteQR = (id) => { setQuickReplies(p=>p.filter(q=>q.id!==id)); jsonpCall({action:"deleteQuickReply",id}).catch(e=>console.error(e)); };

  // تحويل شات لليد
  const createLeadFromChat = (chat) => {
    const phone = chatIdToPhone(chat.chat_id);
    const isEG = phone.startsWith("20");
    setEditLead({
      id:Date.now().toString(),
      clientName: chat.name||"",
      phone: phone.replace(/^966|^20/,""),
      phoneCountry: isEG?"+20":"+966",
      source:"واتساب",
      teleStage:"new_lead", salesStage:null, priority:"medium",
      currency:"SAR", followUpDate:today(), createdAt:today(), updatedAt:today(),
      activityLog:[], _fromChat: chat.chat_id
    });
    setShowLeadModal(true);
    setTab("leads");
  };

  if (!currentUser) return <LoginScreen onLogin={login}/>;

  const visibleLeads = leads.filter(l=>{
    if (can.allLeads(currentUser)) return true;
    if (currentUser.role==="outreach") return l.teleAgent===currentUser.id;
    if (currentUser.role==="sales") return l.salesAgent===currentUser.id||l.teleStage==="meeting_booked";
    return l.teleAgent===currentUser.id||l.salesAgent===currentUser.id;
  });

  const filteredLeads = visibleLeads.filter(l=>{
    const q=search.toLowerCase();
    const mq=!q || (l.clientName||"").toLowerCase().includes(q) || (l.phone||"").includes(q) || (l.dmName||"").toLowerCase().includes(q);
    return mq
      && (!fNiche||l.niche===fNiche)
      && (!fSource||l.source===fSource)
      && (!fPriority||l.priority===fPriority)
      && (!fTeleStage||l.teleStage===fTeleStage)
      && (!fSalesStage||l.salesStage===fSalesStage);
  });

  const leadAlerts = visibleLeads.flatMap(getLeadAlerts);
  const renewalAlerts = (can.renewals(currentUser)?renewals:[]).map(getRenewalAlert).filter(Boolean);
  const alertCount = leadAlerts.length + renewalAlerts.length;

  const TABS=[
    {id:"dashboard",label:"📊 Dashboard",show:true},
    {id:"leads",label:"👥 الليدز",show:true},
    {id:"pipeline",label:"🔄 البايبلاين",show:true},
    {id:"whatsapp",label:waUnread>0?`💬 واتساب (${waUnread})`:"💬 واتساب",show:can.whatsapp(currentUser)},
    {id:"renewals",label:"🔁 التجديدات",show:can.renewals(currentUser)},
    {id:"finance",label:"💼 الحسابات",show:can.finance(currentUser)},
    {id:"rules",label:"⚙️ Rules",show:can.rules(currentUser)},
  ].filter(t=>t.show);

  const filterSel = (val,setVal,opts,placeholder) => (
    <select value={val} onChange={e=>setVal(e.target.value)} style={{...inputS,width:"auto",minWidth:120,padding:"8px 10px",fontSize:12}}>
      <option value="">{placeholder}</option>
      {opts.map(o=><option key={o.value||o} value={o.value||o}>{o.label||o}</option>)}
    </select>
  );

  return (
    <div style={{minHeight:"100vh",background:T.bg,color:T.text,fontFamily:"'Segoe UI',Tahoma,Arial,sans-serif",direction:"rtl"}}>
      <div style={{background:T.primary,padding:"0 16px",display:"flex",alignItems:"center",justifyContent:"space-between",height:58,position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 12px rgba(30,27,75,0.25)"}}>
        <div style={{display:"flex",alignItems:"center",gap:14,overflow:"hidden"}}>
          <div style={{fontWeight:800,fontSize:16,color:"#fff",whiteSpace:"nowrap"}}>🏢 معوان</div>
          <div className="header-tabs" style={{display:"flex",gap:2}}>
            {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"6px 13px",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,whiteSpace:"nowrap",background:tab===t.id?"rgba(255,255,255,0.18)":"transparent",color:tab===t.id?"#fff":"rgba(255,255,255,0.6)"}}>{t.label}</button>)}
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {alertCount>0 && <button onClick={()=>setShowAlerts(true)} style={{background:"#dc2626",border:"none",color:"#fff",borderRadius:20,padding:"4px 12px",fontSize:12,fontWeight:800,cursor:"pointer"}}>🔔 {alertCount}</button>}
          {loading&&<span style={{color:"rgba(255,255,255,0.7)",fontSize:11}}>⏳</span>}
          <button onClick={()=>loadAll(currentUser)} style={{background:"rgba(255,255,255,0.12)",border:"none",color:"#fff",borderRadius:8,padding:"6px 10px",cursor:"pointer",fontSize:12}}>🔄</button>
          <div className="hide-mobile" style={{textAlign:"left"}}>
            <div style={{color:"#fff",fontSize:12,fontWeight:700}}>{currentUser.name}</div>
            <div style={{color:"rgba(255,255,255,0.5)",fontSize:10}}>{ROLES[currentUser.role]?.label}</div>
          </div>
          <button onClick={logout} style={{background:"rgba(220,38,38,0.25)",border:"none",color:"#fca5a5",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:12}}>خروج</button>
        </div>
      </div>

      <div style={{padding:"20px 16px",maxWidth:1400,margin:"0 auto"}}>
        {tab==="dashboard"&&<Dashboard leads={visibleLeads} renewals={can.renewals(currentUser)?renewals:[]} user={currentUser} period={period} setPeriod={setPeriod}/>}

        {tab==="leads"&&(
          <div>
            <div style={{display:"flex",gap:10,marginBottom:14,alignItems:"center",flexWrap:"wrap"}}>
              <h2 style={{margin:0,fontSize:17,color:T.text}}>الليدز ({filteredLeads.length})</h2>
              <div style={{flex:1}}/>
              <button onClick={()=>{setEditLead(null);setShowLeadModal(true);}} style={btnPrimary}>➕ إضافة ليد</button>
            </div>
            <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap",background:T.card,padding:"12px 14px",borderRadius:12,boxShadow:T.shadow}}>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 بحث بالاسم أو الرقم..." style={{...inputS,width:"auto",minWidth:180,padding:"8px 12px",fontSize:12}}/>
              {filterSel(fNiche,setFNiche,NICHES,"كل النيتشات")}
              {filterSel(fSource,setFSource,SOURCES,"كل المصادر")}
              {filterSel(fPriority,setFPriority,[{value:"high",label:"🔴 عالي"},{value:"medium",label:"🟡 متوسط"},{value:"low",label:"🟢 منخفض"}],"كل الأولويات")}
              {filterSel(fTeleStage,setFTeleStage,TELE_STAGES.map(s=>({value:s.id,label:s.label})),"مراحل الأوتريتش")}
              {filterSel(fSalesStage,setFSalesStage,SALES_STAGES.map(s=>({value:s.id,label:s.label})),"مراحل السيلز")}
              {(fNiche||fSource||fPriority||fTeleStage||fSalesStage||search)&&(
                <button onClick={()=>{setSearch("");setFNiche("");setFSource("");setFPriority("");setFTeleStage("");setFSalesStage("");}} style={{...btnGhost,padding:"7px 14px",fontSize:12,color:T.danger}}>✕ مسح الفلاتر</button>
              )}
            </div>
            <div style={{background:T.card,borderRadius:14,overflow:"hidden",boxShadow:T.shadow}}>
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse"}}>
                  <thead><tr style={{background:"#f8fafc",color:T.textSoft,fontSize:11}}>
                    <th style={{textAlign:"right",padding:"11px 14px"}}>العميل</th>
                    {can.allLeads(currentUser)&&<th className="hide-mobile" style={{textAlign:"right",padding:"11px 14px"}}>التواصل</th>}
                    <th style={{textAlign:"right",padding:"11px 14px"}}>أوتريتش</th>
                    <th style={{textAlign:"right",padding:"11px 14px"}}>سيلز</th>
                    <th className="hide-mobile" style={{textAlign:"right",padding:"11px 14px"}}>الأولوية</th>
                    <th style={{textAlign:"right",padding:"11px 14px"}}>الموعد القادم</th>
                    <th style={{padding:"11px 14px"}}></th>
                  </tr></thead>
                  <tbody>
                    {filteredLeads.length===0&&<tr><td colSpan={7} style={{padding:40,textAlign:"center",color:T.textMuted}}>{loading?"⏳ جارٍ التحميل...":"لا يوجد ليدز مطابقة"}</td></tr>}
                    {filteredLeads.map(l=><LeadRow key={l.id} lead={l} user={currentUser} showFull={can.allLeads(currentUser)} onEdit={l=>{setEditLead(l);setShowLeadModal(true);}} onActivity={setActivityLead}/>)}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        )}

        {tab==="pipeline"&&(
          <div>
            <h2 style={{margin:"0 0 16px",fontSize:17}}>🔄 البايبلاين</h2>
            {[{title:"📞 الأوتريتش",stages:TELE_STAGES,key:"teleStage"},{title:"💼 السيلز",stages:SALES_STAGES,key:"salesStage"}].map(sec=>(
              <div key={sec.title}>
                <p style={{color:T.textSoft,fontSize:13,margin:"14px 0 10px",fontWeight:700}}>{sec.title}</p>
                <div style={{display:"flex",gap:10,overflowX:"auto",paddingBottom:14}}>
                  {sec.stages.map(stage=>{
                    const sl=visibleLeads.filter(l=>l[sec.key]===stage.id);
                    return <div key={stage.id} style={{minWidth:175,background:T.card,borderRadius:12,padding:12,borderTop:`3px solid ${stage.color}`,flexShrink:0,boxShadow:T.shadow}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                        <span style={{color:stage.color,fontSize:12,fontWeight:700}}>{stage.icon} {stage.label}</span>
                        <span style={{background:stage.color+"15",color:stage.color,borderRadius:10,padding:"1px 8px",fontSize:11,fontWeight:700}}>{sl.length}</span>
                      </div>
                      {sl.map(l=>{
                        const urgent = getLeadAlerts(l).some(a=>["overdue","today"].includes(a.level));
                        return <div key={l.id} onClick={()=>{setEditLead(l);setShowLeadModal(true);}} style={{background:urgent?"#fef2f2":"#f8fafc",borderRadius:8,padding:"9px 10px",marginBottom:7,cursor:"pointer",border:`1px solid ${urgent?"#fecaca":T.cardBorder}`}}>
                          <div style={{color:urgent?T.danger:T.text,fontSize:12,fontWeight:700}}>{urgent&&"🔴 "}{can.allLeads(currentUser)?l.clientName:`#${l.id}`}</div>
                          <div style={{color:T.textMuted,fontSize:10,marginTop:2}}>{l.niche}</div>
                        </div>;
                      })}
                    </div>;
                  })}
                </div>
              </div>
            ))}
          </div>
        )}

        {tab==="whatsapp"&&can.whatsapp(currentUser)&&(
          <WhatsAppTab user={currentUser} instances={instances} funnel={funnel} quickReplies={quickReplies} leads={leads}
            onOpenLead={l=>{setEditLead(l);setShowLeadModal(true);}}
            onCreateLeadFromChat={createLeadFromChat}/>
        )}

        {tab==="renewals"&&can.renewals(currentUser)&&(
          <RenewalsTab renewals={renewals} user={currentUser}
            onEdit={r=>{setEditRenewal(r);setShowRenewalModal(true);}}
            onAdd={()=>{setEditRenewal(null);setShowRenewalModal(true);}}/>
        )}

        {tab==="finance"&&can.finance(currentUser)&&(
          <FinanceTab expenses={expenses} collections={collections} settings={settings}
            onAddExpense={handleAddExpense} onEditExpense={handleEditExpense} onDeleteExpense={handleDeleteExpense}
            onAddCollection={handleAddCollection} onEditCollection={handleEditCollection} onDeleteCollection={handleDeleteCollection}
            onSaveSettings={handleSaveSettings} period={period} setPeriod={setPeriod}/>
        )}

        {tab==="rules"&&can.rules(currentUser)&&(
          <RulesTab users={usersList} instances={instances} funnel={funnel} quickReplies={quickReplies}
            onSaveUser={handleSaveUser} onSaveInstances={handleSaveInstances} onSaveFunnel={handleSaveFunnel}
            onSaveQR={handleSaveQR} onDeleteQR={handleDeleteQR}/>
        )}
      </div>

      {showLeadModal&&<LeadModal lead={editLead} user={currentUser} allLeads={leads} onSave={(l)=>{
        handleSaveLead(l);
        if (l._fromChat) jsonpCall({action:"linkChat",chatId:l._fromChat,leadId:l.id}).catch(e=>console.error(e));
      }} onClose={()=>{setShowLeadModal(false);setEditLead(null);}}/>}
      {activityLead&&<ActivityModal lead={activityLead} user={currentUser} onAddActivity={handleActivity} onClose={()=>setActivityLead(null)}/>}
      {showRenewalModal&&<RenewalModal renewal={editRenewal} user={currentUser} onSave={handleSaveRenewal} onClose={()=>{setShowRenewalModal(false);setEditRenewal(null);}}/>}
      {showAlerts&&<AlertsPopup alerts={leadAlerts} renewalAlerts={renewalAlerts} onClose={()=>setShowAlerts(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
